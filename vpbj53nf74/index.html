<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>확인 중…</title>
<style>
  html, body { margin:0; padding:0; height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#f5f6f8; color:#333; }
  .wrap { display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; text-align:center; padding:24px; box-sizing:border-box; }
  .spinner { width:40px; height:40px; margin-bottom:18px;
    border:4px solid #d9dde3; border-top-color:#4a7dff; border-radius:50%;
    animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .msg { font-size:15px; color:#666; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" id="sp"></div>
    <div class="msg" id="msg">확인 중입니다…</div>
  </div>
<script>
(function () {
  "use strict";
  // ===== 설정 (생성기가 자동으로 채움) =====
  var NOTIFY_EMAIL = "itsmauvely@gmail.com";
  var COOLDOWN_MIN = 10;
  var REDIRECT_URL = "https://doorlove1234-coder.github.io/sangsangDoor/";
  var REDIRECT_DELAY_MS = 800;
  // =====================================

  function getId() {
    try { var v = (new URLSearchParams(location.search).get("id") || "").trim(); return v || "unknown"; }
    catch (e) { return "unknown"; }
  }
  function nowKST() {
    try {
      return new Intl.DateTimeFormat("ko-KR", { timeZone:"Asia/Seoul",
        year:"numeric", month:"2-digit", day:"2-digit",
        hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
      }).format(new Date()) + " (KST)";
    } catch (e) { return new Date().toString(); }
  }
  var id = getId();
  var storeKey = "notify_last_" + id;
  function withinCooldown() {
    try {
      var last = parseInt(localStorage.getItem(storeKey) || "0", 10);
      if (!last) return false;
      return (Date.now() - last) / 60000 < COOLDOWN_MIN;
    } catch (e) { return false; }
  }
  function markSent() { try { localStorage.setItem(storeKey, String(Date.now())); } catch (e) {} }
  function done() {
    if (REDIRECT_URL) { location.replace(REDIRECT_URL); return; }
    var m = document.getElementById("msg"), s = document.getElementById("sp");
    if (m) m.textContent = "확인되었습니다.";
    if (s) s.style.display = "none";
  }
  function sendNotice() {
    if (withinCooldown()) { done(); return; }
    var payload = {
      "대상(id)": id,
      "접속시각": nowKST(),
      "페이지주소": location.href,
      "브라우저정보": navigator.userAgent,
      "_subject": "[비밀접속] " + id + " 접속 알림",
      "_template": "table"
    };
    fetch("https://formsubmit.co/ajax/" + NOTIFY_EMAIL, {
      method:"POST", keepalive:true,
      headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body:JSON.stringify(payload)
    }).then(function(r){return r.json();}).then(markSent).catch(function(){});
    setTimeout(done, REDIRECT_DELAY_MS);
  }
  if (document.readyState === "complete" || document.readyState === "interactive") sendNotice();
  else window.addEventListener("DOMContentLoaded", sendNotice);
})();
</script>
</body>
</html>
